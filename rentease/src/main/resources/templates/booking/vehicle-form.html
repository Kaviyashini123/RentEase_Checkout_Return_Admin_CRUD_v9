<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head(${vehicle.id == null ? 'Add Vehicle' : 'Edit Vehicle'})}"></head>
<body class="admin-vehicle-form-body">
<header th:replace="~{fragments/layout :: navbar('booking')}"></header>
<main class="container admin-vehicle-form-page">
    <div class="page-header admin-form-intro"><div><span class="eyebrow">RENTEASE · FLEET OPERATIONS</span><h1 th:text="${vehicle.id == null ? 'Add a vehicle' : 'Update vehicle details'}"></h1><p class="page-sub">Keep vehicle specifications, pricing and availability current.</p></div></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <form class="card form-grid admin-vehicle-form" method="post" th:object="${vehicle}" th:action="${vehicle.id == null ? '/booking/new' : '/booking/edit/' + vehicle.id}">
        <label>Make<input th:field="*{brand}" autocomplete="off" required><small class="admin-field-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></small></label>
        <label>Model<input th:field="*{model}" required><small class="admin-field-error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></small></label>
        <label>Model year<input type="number" th:field="*{manufactureYear}" required><small class="admin-field-error" th:if="${#fields.hasErrors('manufactureYear')}" th:errors="*{manufactureYear}"></small></label>
        <label>Registration<input th:field="*{plateNumber}" required><small class="admin-field-error" th:if="${#fields.hasErrors('plateNumber')}" th:errors="*{plateNumber}"></small></label>
        <label>Category<select th:field="*{type}"><option th:each="x:${types}" th:value="${x}" th:text="${x}"></option></select><small class="admin-field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></small></label>
        <label>Transmission<select th:field="*{transmission}"><option th:each="x:${transmissions}" th:value="${x}" th:text="${x}"></option></select><small class="admin-field-error" th:if="${#fields.hasErrors('transmission')}" th:errors="*{transmission}"></small></label>
        <label>Fuel type<select th:field="*{fuelType}"><option th:each="x:${fuelTypes}" th:value="${x}" th:text="${x}"></option></select><small class="admin-field-error" th:if="${#fields.hasErrors('fuelType')}" th:errors="*{fuelType}"></small></label>
        <label>Passenger capacity<input type="number" th:field="*{seatingCapacity}" min="1" required><small class="admin-field-error" th:if="${#fields.hasErrors('seatingCapacity')}" th:errors="*{seatingCapacity}"></small></label>
        <label>Daily rate · LKR<input type="number" step="0.01" th:field="*{dailyRate}" required><small class="admin-field-error" th:if="${#fields.hasErrors('dailyRate')}" th:errors="*{dailyRate}"></small></label>
        <label>Pickup location<input th:field="*{location}"><small class="admin-field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></small></label>
        <label>Availability<select th:field="*{status}"><option th:each="x:${statuses}" th:value="${x}" th:text="${x}"></option></select><small class="admin-field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small></label>
        <label>Vehicle image URL<input type="url" th:field="*{imageUrl}"><small class="admin-field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></small></label>
        <label class="form-span">Description<textarea th:field="*{description}" rows="4"></textarea><small class="admin-field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></label>
        <div class="form-span admin-form-actions"><button class="btn btn-primary" type="submit" th:text="${vehicle.id == null ? 'Add to fleet' : 'Save vehicle'}"></button> <a class="btn" th:href="@{/booking/manage}">Cancel</a></div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
