<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: page-head(${payment.id == null ? 'Create Payment' : 'Update Payment'})}"></head><body><header th:replace="~{fragments/layout :: navbar('payment')}"></header><main class="container"><h1 th:text="${payment.id == null ? 'Create Payment' : 'Update Payment'}"></h1><div th:if="${error}" class="alert error" th:text="${error}"></div><form class="card form-grid" method="post" th:action="${payment.id == null ? '/payment/new' : '/payment/edit/' + payment.id}" th:object="${payment}"><label>Reservation ID<input type="number" th:field="*{reservationId}" required></label><label>Customer ID<input type="number" th:field="*{customerId}" required></label><label>Amount<input type="number" step="0.01" th:field="*{amount}" required></label><label>Method<select th:field="*{method}"><option th:each="x:${methods}" th:value="${x}" th:text="${x}"></option></select></label><label>Status<select th:field="*{status}"><option th:each="x:${statuses}" th:value="${x}" th:text="${x}"></option></select></label><label>Transaction Reference<input th:field="*{transactionReference}"></label><label>Failure Reason<input th:field="*{failureReason}"></label><div><button class="btn btn-primary" type="submit">Save Payment</button> <a class="btn" th:href="@{/payment/manage}">Cancel</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
