spring.application.name=RentEase

# ---- Microsoft SQL Server Express (SQL Server Authentication) ----
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=RentEaseDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=KV625080
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate manages the schema for the academic project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Load sample data after Hibernate creates/updates the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.separator=@@

spring.thymeleaf.cache=false

server.port=8080
